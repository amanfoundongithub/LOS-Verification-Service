################################################################################
# Spring application configuration.                                            #
#                                                                              #
################################################################################
spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  profiles:
    active: ${SPRING_PROFILE_ACTIVE}

server:
  port: ${SERVER_PORT}

################################################################################
# Tesseract OCR configuration.                                                 #
#                                                                              #
################################################################################
tesseract:
  data:
    path: "src/main/resources/tessdata"
    language: "eng"
  jna:
    path: "/opt/homebrew/lib"

################################################################################
# Gemini Credentials: These credentials are required for configuring           #
# Gemini models and the API.                                                   #
#                                                                              #
# These are loaded directly from the `application-<environment>.yaml` file     #
# Ensure that you have the yaml file created in the local.                     #
#                                                                              #
################################################################################
gemini:
  model: ${GEMINI_MODEL}
  base-url: ${GEMINI_BASE_URL}
  api-key:
    header: ${GEMINI_API_KEY_HEADER}
    value: ${GEMINI_API_KEY}

  prompts:
    document-verification: |
      You are an expert fraud detection and KYC document audit system.
      Cross-examine this raw OCR string text against the target verified data.
      Analyze if values match. Forgiving of minor OCR lighting typos.

      You MUST reply strictly using this JSON format schema:
      {
          "isMatch": true/false,
          "confidenceScore": 0-100,
          "reasoning": "string summary",
          "flaggedAnomalies": "string anomalies"
      }

      --- TARGET VERIFIED DATA ---
      %s

      --- MESSY RAW OCR TEXT ---
      %s